name: colcon-action (linux)
description: Linux build of a colcon workspace
inputs:
  before-script:        { required: false, default: '' }
  ccache-prefix:        { required: false, default: '' }
  ccache-enabled:       { required: false, default: 'true' }
  ccache-maxsize:       { required: false, default: '1G' }
  rosdep-enabled:       { required: false, default: 'true' }
  rosdep-install-args:  { required: false, default: '-iry' }
  add-ros-ppa:          { required: false, default: 'true' }
  vcs-file:             { required: false, default: '' }
  upstream-args:        { required: false, default: '' }
  target-path:          { required: false, default: '' }
  target-args:          { required: false, default: '' }
  run-tests:            { required: false, default: 'true' }
  run-tests-args:       { required: false, default: '' }

runs:
  using: composite
  steps:
    - name: Set sudo variable
      shell: bash
      run: |
        if [ "$(id -u)" -ne 0 ]; then SUDO='sudo'; else SUDO=''; fi
        echo "SUDO=$SUDO" >> $GITHUB_ENV

    - name: Install base deps
      shell: bash
      run: |
        $SUDO apt update -y -qq
        $SUDO apt install -y cmake curl git python3 python3-pip

    - name: Install ROS/Colcon PPA
      if: inputs.add-ros-ppa == 'true'
      shell: bash
      run: |
        $SUDO curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | $SUDO tee /etc/apt/sources.list.d/ros2.list > /dev/null

    - name: Install colcon deps
      shell: bash
      run: |
        $SUDO apt update -y -qq
        $SUDO apt install -y -qq python3-vcstool python3-colcon-common-extensions

    - name: rosdep init & update
      if: inputs.rosdep-enabled == 'true'
      shell: bash
      run: |
        $SUDO apt install -y -qq python3-rosdep
        if [ ! -d /etc/ros/rosdep/sources.list.d ]; then $SUDO rosdep init; fi
        rosdep update --include-eol-distros

    - name: Configure ccache
      id: ccache
      if: inputs.ccache-enabled == 'true'
      shell: bash
      env:
        INPUT_CCACHE_PREFIX: ${{ inputs.ccache-prefix }}
        INPUT_CCACHE_MAXSIZE: ${{ inputs.ccache-maxsize }}
      run: |
        $SUDO apt install -y -qq ccache
        bash "${GITHUB_ACTION_PATH//\\//}/../scripts/configure-ccache.sh"

    # Restore and save are separate steps rather than one actions/cache: its post step re-evaluates
    # `path`, and inside a composite action the steps context it needs is gone by then, so the save
    # is skipped with only "Input required and not supplied: path" in the log.
    - name: Restore cache
      if: steps.ccache.outputs.dir != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.ccache.outputs.dir }}
        key: ${{ steps.ccache.outputs.key }}
        restore-keys: ${{ steps.ccache.outputs.restore_key }}

    # Counters live inside CCACHE_DIR, which the restore just repopulated, so zero them to make the
    # statistics below describe this job alone. See the README, "Reading the numbers".
    - name: Zero ccache statistics
      if: steps.ccache.outputs.dir != ''
      shell: bash
      run: ccache -z

    - name: Build upstream workspace
      if: inputs.vcs-file != ''
      shell: bash
      run: |
        ${{ inputs.before-script }}
        mkdir -p $GITHUB_WORKSPACE/upstream_ws/src
        vcs import --input "$GITHUB_WORKSPACE/${{ inputs.target-path }}/${{ inputs.vcs-file }}" $GITHUB_WORKSPACE/upstream_ws/src
        if [ $? -ge 1 ]; then return 1; fi
        cd $GITHUB_WORKSPACE/upstream_ws
        if [ "${{ inputs.rosdep-enabled }}" = "true" ]; then
          $SUDO apt update -y -qq
          rosdep install --from-paths src ${{ inputs.rosdep-install-args }}
        fi
        colcon build --event-handlers desktop_notification- status- terminal_title- --cmake-args ${{ inputs.upstream-args }}
        if [ $? -ge 1 ]; then return 1; fi

    - name: Build target workspace
      shell: bash
      run: |
        ${{ inputs.before-script }}
        if [ "${{ inputs.vcs-file }}" != "" ]; then
          source $GITHUB_WORKSPACE/upstream_ws/install/setup.bash
        fi
        cd $GITHUB_WORKSPACE/${{ inputs.target-path }}/../
        if [ "${{ inputs.rosdep-enabled }}" = "true" ]; then
          $SUDO apt update -y -qq
          rosdep install --from-paths src ${{ inputs.rosdep-install-args }}
        fi
        colcon build --event-handlers desktop_notification- status- terminal_title- --cmake-args ${{ inputs.target-args }}
        if [ $? -ge 1 ]; then return 1; fi

    - name: Run tests
      if: inputs.run-tests == 'true'
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/${{ inputs.target-path }}/../
        source install/setup.bash
        colcon test --event-handlers console_direct+ --return-code-on-test-failure ${{ inputs.run-tests-args }}
        if [ $? -ge 1 ]; then return 1; fi
        colcon test-result --verbose
        if [ $? -ge 1 ]; then return 1; fi

    - name: Report ccache statistics
      if: ${{ !cancelled() && steps.ccache.outputs.dir != '' }}
      shell: bash
      run: ccache -s

    # Runs after a failed build too: a partially warmed cache is still worth keeping. The dir test
    # covers a failure before Configure ccache, where there is nothing to save and no key to save it
    # under.
    - name: Save cache
      if: ${{ !cancelled() && steps.ccache.outputs.dir != '' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.ccache.outputs.dir }}
        key: ${{ steps.ccache.outputs.key }}
